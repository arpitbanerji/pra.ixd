[project]
name = "ohbot"
version = "0.1.0"
description = "Telegram <-> OpenHands bridge: chat with an OpenHands agent from your phone"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.6,<22",
    "httpx>=0.27,<0.29",
    "aiosqlite>=0.20,<0.22",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration test that talks to a real OpenHands agent server",
]
